name: Checkmate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run unit & security tests (pytest)
        run: pytest -v

      - name: Static analysis - Bandit (SAST)
        run: bandit -r app -ll

      - name: Dependency scan - pip-audit
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-scan
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t checkmate-api:ci .
